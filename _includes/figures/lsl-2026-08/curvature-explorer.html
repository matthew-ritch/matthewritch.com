{% raw %}
<style>
.lsl-explorer {
  --lsl-surface: #fcfcfb; --lsl-ink: #0b0b0b; --lsl-sec: #52514e; --lsl-muted: #898781;
  --lsl-line: #e3e2da; --lsl-road: #2a78d6; --lsl-cloud: #8b96a4;
  --lsl-accent: #eb6834; --lsl-dark: #16130f;
  margin: 1.8em auto; max-width: 1080px; line-height: 1.5; color: var(--lsl-ink);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
}
.lsl-explorer * { box-sizing: border-box; }
.lsl-ex-grid { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
.lsl-ex-pane { flex: 1 1 360px; min-width: 260px; }
.lsl-ex-pane.is-map { flex: 1 1 260px; }
.lsl-ex-pane.is-table { flex: 1 1 300px; }

/* Both figures are a stack: a canvas painted once with all twenty thousand
   roads, and lighter overlays for the search matches and the selection.
   Repainting the whole dataset on every keystroke is what this avoids. */
.lsl-ex-stack {
  position: relative; border: 1px solid var(--lsl-line); border-radius: 8px;
  overflow: hidden; background: var(--lsl-surface); touch-action: pan-y;
  cursor: crosshair;
}
.lsl-ex-stack canvas, .lsl-ex-stack svg { display: block; width: 100%; height: auto; }
/* The overlays are painted on top, so without this they would swallow every
   click before it reached the figure underneath. */
.lsl-ex-stack .lsl-ex-over {
  position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none;
}

.lsl-ex-box { border: 1px solid var(--lsl-line); border-radius: 8px; overflow: hidden; }
.lsl-ex-find {
  display: flex; align-items: center; gap: 8px; padding: 7px 9px;
  border-bottom: 1px solid var(--lsl-line); background: var(--lsl-surface);
}
.lsl-ex-find input {
  flex: 1 1 auto; min-width: 0; font: inherit; font-size: 0.86rem;
  padding: 0.3em 0.55em; color: var(--lsl-ink);
  border: 1px solid var(--lsl-line); border-radius: 5px; background: #fff;
}
.lsl-ex-find input:focus { outline: 2px solid rgba(235, 104, 52, 0.4); outline-offset: -1px; }
.lsl-ex-find output {
  flex: 0 0 auto; font-size: 0.78rem; color: var(--lsl-muted);
  font-variant-numeric: tabular-nums;
}
.lsl-ex-head {
  display: flex; background: #f2f1ea; border-bottom: 1px solid var(--lsl-line);
  font-size: 0.86rem; font-weight: 600; user-select: none;
}
.lsl-ex-head span { padding: 0.45em 0.8em; cursor: pointer; white-space: nowrap; }
.lsl-ex-head span:first-child { flex: 1 1 auto; }
.lsl-ex-head span.num { flex: 0 0 5.6em; text-align: right; }
.lsl-ex-head .lsl-ex-ar { padding: 0; color: var(--lsl-muted); font-size: 0.8em; }

/* The rows are absolutely positioned inside a spacer as tall as the whole
   table, so the scrollbar behaves as if all 20,000 were there while only the
   thirty on screen actually exist. */
.lsl-ex-scroll { height: 500px; overflow-y: auto; overflow-x: hidden; position: relative; }
.lsl-ex-spacer { position: relative; width: 100%; }
.lsl-ex-row {
  position: absolute; left: 0; right: 0; height: 25px; display: flex;
  align-items: center; cursor: pointer; font-size: 0.86rem;
  border-bottom: 1px solid var(--lsl-line); font-variant-numeric: tabular-nums;
}
.lsl-ex-row:hover { background: rgba(137, 135, 129, 0.09); }
.lsl-ex-row.is-sel { background: rgba(235, 104, 52, 0.16); font-weight: 600; }
.lsl-ex-row i {
  font-style: normal; padding: 0 0.8em; flex: 1 1 auto;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.lsl-ex-row b { font-weight: inherit; flex: 0 0 5.6em; text-align: right; padding-right: 0.8em; }
</style>

<div class="lsl-explorer" id="lsl-ex">
  <div class="lsl-ex-grid">

    <div class="lsl-ex-pane">

        <canvas id="lsl-ex-plot" width="580" height="560"

        <canvas class="lsl-ex-over" id="lsl-ex-plot-hits" width="580" height="560" aria-hidden="true"></canvas>

    <div class="lsl-ex-pane is-map">

                role="img" aria-label="Every road in the Atlanta box, with the selected road picked out"></canvas>
        <canvas class="lsl-ex-over" id="lsl-ex-map-over" width="420" height="420" aria-hidden="true"></canvas>

    </div>

    <div class="lsl-ex-pane is-table">
      <div class="lsl-ex-box">
        <div class="lsl-ex-find">
          <input id="lsl-ex-find" type="search" autocomplete="off" spellcheck="false"

        </div>
        <div class="lsl-ex-head" id="lsl-ex-head">
          <span data-k="name">name <i class="lsl-ex-ar"></i></span>
          <span data-k="len" class="num">length <i class="lsl-ex-ar">&#9660;</i></span>
          <span data-k="curv" class="num">curvature <i class="lsl-ex-ar"></i></span>
        </div>
        <div class="lsl-ex-scroll" id="lsl-ex-scroll">
          <div class="lsl-ex-spacer" id="lsl-ex-spacer"></div>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
// The explorer holds every road in the box at once, so nothing here gets its
// own DOM node. The scatter and the map are canvases painted once; the table
// renders only the rows you can actually see. What would be forty thousand
// elements is about forty.
(function () {
  var node = document.getElementById('lsl-ex-data');
  if (!node) return;
  var D = JSON.parse(node.textContent);
  var N = D.names.length;

  // ------------------------------------------------------------- decoding
  // Google's polyline varint: five bits per character, zig-zagged so small
  // negative steps stay one character wide.
  function Reader(s) { this.s = s; this.i = 0; }
  Reader.prototype.next = function () {
    var result = 0, shift = 0, byte;
    do {

    return (result >>> 1) ^ -(result & 1);

  var reader = new Reader(D.lengths), running = 0, i;
  for (i = 0; i < N; i++) { running += reader.next(); lengths[i] = running * D.lengthUnit; }
  reader = new Reader(D.curvatures);
  for (i = 0; i < N; i++) {
    var code = reader.next();

    // curvature was shifted up past it before encoding.
    curvature[i] = code === 0 ? 0
      : Math.pow(10, (code - 1 + D.curvatureBase) * D.curvatureUnit);
  }

  // subpath starts, and which subpaths belong to which road.

  var partAt = new Int32Array(1 << 13), nParts = 0;
  var roadAt = new Int32Array(N + 1);

    if (nPoints * 2 + need <= points.length) return;
    var grown = new Int16Array(Math.max(points.length * 2, nPoints * 2 + need));
    grown.set(points.subarray(0, nPoints * 2));
    points = grown;
  }
  function partRoom() {
    if (nParts + 1 < partAt.length) return;
    var grown = new Int32Array(partAt.length * 2);
    grown.set(partAt);
    partAt = grown;
  }

      var x = 0, y = 0;
      for (var k = 0; k < count; k++) {

    return PH - PAD.b - (v - y0) / (y1 - y0) * (PH - PAD.t - PAD.b);
  }

  var plotX = new Float32Array(N), plotY = new Float32Array(N);

  var plotOver = document.getElementById('lsl-ex-plot-over');
  var map = document.getElementById('lsl-ex-map');
  var mapStack = document.getElementById('lsl-ex-map-stack');

    t.setAttribute('fill', fill);

    t.appendChild(document.createTextNode(text));
    if (sup != null) {

      s.setAttribute('dy', -5); s.setAttribute('font-size', size - 3);
      s.appendChild(document.createTextNode(sup));

  function drawAxes() {

    for (d = Math.ceil(Math.log10(minCurv)); d <= Math.floor(Math.log10(maxCurv)); d += 2) {

    svgText(PAD.l - 7, py(0) + 4, '0', null, 'end', 11, muted);
    svgText(PAD.l + (PW - PAD.l - PAD.r) / 2, PH - 6, 'length', null, 'middle', 13, sec);
    var yl = svgText(14, PAD.t + (PH - PAD.t - PAD.b) / 2, 'curvature', null, 'middle', 13, sec);
    yl.setAttribute('transform', 'rotate(-90 14 ' + (PAD.t + (PH - PAD.t - PAD.b) / 2) + ')');
  }

  function dots(ctx, list, n, radius) {
    ctx.beginPath();
    for (var j = 0; j < n; j++) {
      var idx = list[j];
      ctx.moveTo(plotX[idx] + radius, plotY[idx]);
      ctx.arc(plotX[idx], plotY[idx], radius, 0, 6.283185);
    }
    ctx.fill();
  }

  function drawPlot() {
    pctx.clearRect(0, 0, PW, PH);
    // The break under which the exactly-straight roads sit.
    pctx.strokeStyle = '#c3c2b7';
    pctx.setLineDash([2, 3]);
    pctx.beginPath();
    pctx.moveTo(PAD.l, py(floor * 3.2)); pctx.lineTo(PW - PAD.r, py(floor * 3.2));
    pctx.stroke();
    pctx.setLineDash([]);

    pctx.fillStyle = 'rgba(139, 150, 164, 0.45)';
    var all = new Int32Array(N);
    for (var j = 0; j < N; j++) all[j] = j;
    dots(pctx, all, N, 2.1);
  }

  // ---------------------------------------------------------------- the map
  var grid = D.grid, MW = 420;
  // The box is square in degrees, so the map is square too -- same as the
  // static figures, which also plot raw lat/lon.
  function mx(gx) { return gx / grid * MW; }
  function my(gy) { return MW - gy / grid * MW; }

  function tracePath(ctx, road) {
    for (var p = roadAt[road]; p < roadAt[road + 1]; p++) {
      var from = partAt[p], to = partAt[p + 1];
      for (var q = from; q < to; q++) {
        var X = mx(points[q * 2]), Y = my(points[q * 2 + 1]);
        if (q === from) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
      }
    }
  }

  function drawMap() {
    mctx.clearRect(0, 0, MW, MW);
    mctx.strokeStyle = 'rgba(42, 120, 214, 0.5)';
    mctx.lineWidth = 0.4;
    mctx.lineJoin = 'round';
    mctx.lineCap = 'round';
    mctx.beginPath();
    for (var r = 0; r < N; r++) tracePath(mctx, r);
    mctx.stroke();
  }

  // Search matches go on in a light accent, the selected road on top of them
  // in full strength, so a search for "Peachtree" lights up every one at once.
  function drawOverlays() {
    octx.clearRect(0, 0, MW, MW);
    hctx.clearRect(0, 0, PW, PH);

    if (hits) {
      hctx.fillStyle = 'rgba(235, 104, 52, 0.85)';
      dots(hctx, order, count, 2.4);

      octx.strokeStyle = 'rgba(235, 104, 52, 0.85)';
      octx.lineWidth = 1.6;
      octx.lineJoin = octx.lineCap = 'round';
      octx.beginPath();
      for (var j = 0; j < count; j++) tracePath(octx, order[j]);
      octx.stroke();
    }

    if (selected != null) {
      octx.strokeStyle = '#c1440e';
      octx.lineWidth = 2.6;
      octx.lineJoin = octx.lineCap = 'round';
      octx.beginPath();
      tracePath(octx, selected);
      octx.stroke();
    }
  }

  // -------------------------------------------------------------- the table
  var ROW = 25, OVERSCAN = 6;
  var scroll = document.getElementById('lsl-ex-scroll');
  var spacer = document.getElementById('lsl-ex-spacer');

  // `sorted` is every road in the current sort; `order` is the slice of it
  // that survives the search, and `rank` says where each road sits in that
  // slice (-1 when the search has filtered it out).
  var sorted = new Int32Array(N), order = new Int32Array(N), rank = new Int32Array(N);
  var count = N, hits = null, lower = null;
  for (i = 0; i < N; i++) sorted[i] = i;

  function fmtLen(v) { return v.toFixed(4); }
  function fmtCurv(v) { return v === 0 ? '0' : v.toExponential(2).toUpperCase(); }

  var pool = [], first = -1, shown = -1;
  function rowNode(k) {
    while (pool.length <= k) {
      var row = document.createElement('div');
      row.className = 'lsl-ex-row';
      row.appendChild(document.createElement('i'));
      row.appendChild(document.createElement('b'));
      row.appendChild(document.createElement('b'));
      spacer.appendChild(row);
      pool.push(row);
    }
    return pool[k];
  }

  function paintRows(force) {
    var start = Math.max(0, (scroll.scrollTop / ROW | 0) - OVERSCAN);
    var n = Math.min(count - start, Math.ceil(scroll.clientHeight / ROW) + OVERSCAN * 2);
    if (n < 0) n = 0;
    if (!force && start === first && n === shown) return;
    first = start; shown = n;
    for (var k = 0; k < n; k++) {
      var idx = order[start + k], row = rowNode(k);
      row.style.transform = 'translateY(' + (start + k) * ROW + 'px)';
      row.style.display = '';
      row.dataset.i = idx;
      row.children[0].textContent = D.names[idx];
      row.children[1].textContent = fmtLen(lengths[idx]);
      row.children[2].textContent = fmtCurv(curvature[idx]);
      row.classList.toggle('is-sel', idx === selected);
    }
    for (; k < pool.length; k++) pool[k].style.display = 'none';
  }

  function showRow(idx) {
    if (rank[idx] < 0) return;
    scroll.scrollTop = Math.max(0, rank[idx] * ROW - scroll.clientHeight / 2);
  }

  // ------------------------------------------------------------- selection
  var selected = null;
  function select(idx, from) {
    selected = idx;
    marker.setAttribute('cx', plotX[idx]);
    marker.setAttribute('cy', plotY[idx]);
    marker.style.display = '';
    drawOverlays();
    if (from !== 'row') showRow(idx);
    paintRows(true);
  }

  var marker = document.createElementNS(NS, 'circle');
  marker.setAttribute('r', 5.5);
  marker.setAttribute('fill', 'none');
  marker.setAttribute('stroke', '#c1440e');
  marker.setAttribute('stroke-width', 2);
  marker.style.display = 'none';

  // ------------------------------------------------------- search and sort
  var sortKey = 'len', sortDir = -1;
  var find = document.getElementById('lsl-ex-find');
  var found = document.getElementById('lsl-ex-found');

  function resort() {
    var plain = Array.prototype.slice.call(sorted);
    if (sortKey === 'name') {
      names();
      plain.sort(function (a, b) {
        return lower[a] < lower[b] ? -sortDir : lower[a] > lower[b] ? sortDir : a - b;
      });
    } else {
      var v = sortKey === 'len' ? lengths : curvature;
      plain.sort(function (a, b) { return (v[a] - v[b]) * sortDir || a - b; });
    }
    sorted.set(plain);
  }

  function names() {
    if (!lower) lower = D.names.map(function (n) { return n.toLowerCase(); });
  }

  function refilter(query) {
    query = query.trim().toLowerCase();
    if (!query) {
      hits = null;
      order.set(sorted);
      count = N;
      found.textContent = '';
    } else {
      names();
      hits = new Uint8Array(N);
      count = 0;
      for (var k = 0; k < N; k++) {
        var idx = sorted[k];
        if (lower[idx].indexOf(query) >= 0) { hits[idx] = 1; order[count++] = idx; }
      }
      found.textContent = count === 1 ? '1 road' : count.toLocaleString() + ' roads';
    }
    rank.fill(-1);
    for (var j = 0; j < count; j++) rank[order[j]] = j;
    spacer.style.height = count * ROW + 'px';
  }

  var pending = null;
  function rerun(keepScroll) {
    refilter(find ? find.value : '');
    drawOverlays();
    if (!keepScroll) {
      if (selected != null && rank[selected] >= 0) showRow(selected);
      else scroll.scrollTop = 0;
    }
    paintRows(true);
  }

  if (find) {
    find.addEventListener('input', function () {
      // Coalesce a burst of keystrokes into one repaint: the match overlay can
      // redraw twenty thousand dots and roads, and a fast typist should not pay
      // for that on every letter.
      clearTimeout(pending);
      pending = setTimeout(function () { rerun(false); }, 16);
    });
  }

  var head = document.getElementById('lsl-ex-head');
  function arrows() {
    Array.prototype.forEach.call(head.children, function (cell) {
      cell.querySelector('.lsl-ex-ar').textContent =
        cell.dataset.k === sortKey ? (sortDir < 0 ? '▼' : '▲') : '';
    });
  }
  head.addEventListener('click', function (e) {
    var cell = e.target.closest('[data-k]');
    if (!cell) return;
    if (cell.dataset.k === sortKey) sortDir = -sortDir;
    else { sortKey = cell.dataset.k; sortDir = cell.dataset.k === 'name' ? 1 : -1; }
    resort();
    arrows();
    rerun(false);
  });

  // ----------------------------------------------------------------- events
  function atPointer(e) {
    var box = plot.getBoundingClientRect();
    return nearest(
      (e.clientX - box.left) / box.width * PW,
      (e.clientY - box.top) / box.height * PH,
      8
    );
  }

  // Listeners go on the stack, not the canvas: the overlays sit on top, and
  // the clicks have to survive whichever of them the pointer lands on.
  plotStack.addEventListener('click', function (e) {
    var hit = atPointer(e);
    if (hit >= 0) select(hit, 'dot');
  });
  plotStack.addEventListener('pointermove', function (e) {
    if (e.pointerType !== 'mouse') return;
    var hit = atPointer(e);
    if (hit >= 0 && window.LSLTip) {
      window.LSLTip.show(D.names[hit] + '  ·  length ' + fmtLen(lengths[hit]) +
        ', curvature ' + fmtCurv(curvature[hit]), e);
    } else if (window.LSLTip) window.LSLTip.hide();
  });
  plotStack.addEventListener('pointerleave', function () {
    if (window.LSLTip) window.LSLTip.hide();
  });

  // Square of the distance from a point to a segment. Roads here are long and
  // straight, so measuring to the nearest vertex would miss by half a road.
  function toSegment(X, Y, ax, ay, bx, by) {
    var vx = bx - ax, vy = by - ay, span = vx * vx + vy * vy;
    var t = span === 0 ? 0 : ((X - ax) * vx + (Y - ay) * vy) / span;
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    var dx = X - (ax + t * vx), dy = Y - (ay + t * vy);
    return dx * dx + dy * dy;
  }

  // The map is clickable too: the nearest road to where you tapped, and while
  // a search is running, the nearest one that matched it.
  mapStack.addEventListener('click', function (e) {
    var box = map.getBoundingClientRect();
    var X = (e.clientX - box.left) / box.width * MW;
    var Y = (e.clientY - box.top) / box.height * MW;
    var best = -1, bestD = 64;
    for (var j = 0; j < count; j++) {
      var r = order[j];
      for (var p = roadAt[r]; p < roadAt[r + 1]; p++) {
        for (var q = partAt[p]; q + 1 < partAt[p + 1]; q++) {
          var d = toSegment(X, Y, mx(points[q * 2]), my(points[q * 2 + 1]),
                            mx(points[q * 2 + 2]), my(points[q * 2 + 3]));
          if (d < bestD) { bestD = d; best = r; }
        }
      }
    }
    if (best >= 0) select(best, 'map');
  });

  scroll.addEventListener('click', function (e) {
    var row = e.target.closest('.lsl-ex-row');
    if (row) select(+row.dataset.i, 'row');
  });
  scroll.addEventListener('scroll', function () { paintRows(false); }, { passive: true });
  window.addEventListener('resize', function () { paintRows(true); }, { passive: true });

  // ------------------------------------------------------------------- go
  plotOver.appendChild(marker);
  drawAxes();
  drawPlot();
  drawMap();
  resort();
  arrows();
  rerun(true);
})();
</script>
