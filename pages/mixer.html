<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>RGB Mix</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0a0a0f;
    color: #e0e0ee;
    font-family: 'Segoe UI', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
  }

  #canvas-wrap {
    position: relative;
    flex: 1 1 0;
    width: 100%;
    min-height: 0;
    background: #000;
    overflow: hidden;
  }

  #display {
    width: 100%;
    height: 100%;
    object-fit: contain;
    image-rendering: pixelated;
    display: block;
  }

  #overlay-msg {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.75rem;
    background: #0009;
    font-size: 1rem;
    color: #aaa;
  }
  #overlay-msg.hidden { display: none; }

  #start-btn {
    padding: 0.6rem 1.4rem;
    background: #4444aa;
    border: none;
    border-radius: 6px;
    color: #eef;
    font-size: 1rem;
    cursor: pointer;
    transition: background 0.15s;
  }
  #start-btn:hover { background: #5555cc; }

  #controls {
    flex-shrink: 0;
    background: #0e0e1a;
    border-top: 1px solid #1e1e33;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0.5rem 1rem;
    gap: 1.2rem;
  }

  #tri-canvas {
    display: block;
    cursor: pointer;
    flex-shrink: 0;
  }

  #side-panel {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    align-items: flex-start;
  }

  .matrix-display {
    font-family: monospace;
    font-size: 0.78rem;
    line-height: 1.6;
    white-space: pre;
  }
  .matrix-display .r { color: #ee5555; }
  .matrix-display .g { color: #55bb55; }
  .matrix-display .b { color: #5577ee; }
  .matrix-display .mode-a { color: #9090cc; }
  .matrix-display .mode-m { color: #ccaa44; }
  .matrix-display .mode-d { color: #cc66aa; }

  .slider-row {
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  .slider-row label {
    font-size: 0.72rem;
    color: #6666aa;
    font-family: monospace;
    flex-shrink: 0;
  }
  .slider-row input[type=range] {
    width: 90px;
    accent-color: #6666cc;
    cursor: pointer;
  }
  .slider-row .val {
    font-size: 0.72rem;
    font-family: monospace;
    color: #9090cc;
    width: 2.8rem;
    text-align: right;
  }

  .btn-row {
    display: flex;
    gap: 0.4rem;
  }

  .icon-btn {
    padding: 0.4rem 0.7rem;
    background: #1c1c2e;
    border: 1px solid #333355;
    border-radius: 5px;
    color: #8888bb;
    font-size: 0.78rem;
    cursor: pointer;
    transition: background 0.12s;
    white-space: nowrap;
    user-select: none;
  }
  .icon-btn:hover { background: #2a2a44; color: #ccccee; }

  .hint {
    font-size: 0.65rem;
    color: #444466;
    font-family: monospace;
    line-height: 1.5;
  }

  @media (max-width: 600px) {
    #controls {
      flex-direction: column;
      padding: 0.4rem;
      gap: 0.5rem;
    }
  }
</style>
</head>
<body>

<div id="canvas-wrap">
  <canvas id="display"></canvas>
  <div id="overlay-msg">
    <span>Camera not started</span>
    <button id="start-btn">Enable Camera</button>
    <span id="err-msg" style="color:#cc5555;font-size:0.8rem;"></span>
  </div>
</div>

<div id="controls">
  <canvas id="tri-canvas"></canvas>
  <div id="side-panel">
    <div class="matrix-display" id="matrix-text"></div>
    <div class="slider-row">
      <label>sc</label>
      <input type="range" id="sl-sc" min="5" max="100" value="30" step="1"/>
      <span class="val" id="val-sc">30%</span>
    </div>
    <div class="btn-row">
      <button class="icon-btn" id="capture-btn">Save</button>
      <button class="icon-btn" id="random-btn">Random</button>
      <button class="icon-btn" id="reset-btn">Reset</button>
    </div>
    <span class="hint">drag to mix &middot; click to toggle A/M/D<br/>dbl-click to reset one</span>
  </div>
</div>

<video id="video" autoplay playsinline muted style="display:none;"></video>
<canvas id="offscreen" style="display:none;"></canvas>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// Geometry constants
// ─────────────────────────────────────────────────────────────────────────────
const TW = 200, TH = 174, PAD = 7;
const triH = TH - 2 * PAD;
const halfBase = triH / Math.sqrt(3);

const outerVerts = [
  [TW / 2, PAD],
  [TW / 2 - halfBase, TH - PAD],
  [TW / 2 + halfBase, TH - PAD],
];

function mid(a, b) { return [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2]; }

function subdivide(v) {
  const [A, B, C] = v;
  const mAB = mid(A, B), mAC = mid(A, C), mBC = mid(B, C);
  return {
    subs: [[A, mAB, mAC], [mAB, B, mBC], [mAC, mBC, C]],
    center: [mAB, mBC, mAC],
  };
}

function ctr(v) {
  return [(v[0][0] + v[1][0] + v[2][0]) / 3, (v[0][1] + v[1][1] + v[2][1]) / 3];
}

// Level 1: 3 major triangles
const L1 = subdivide(outerVerts);
// Level 2: 3 sub-triangles within each major
const L2 = L1.subs.map(v => subdivide(v));

// Mapping: major index -> output channel (0=R, 1=G, 2=B)
const MAJ_OUT = [0, 2, 1]; // top->R, bottom-left->B, bottom-right->G
// Sub-triangle index -> input channel
const SUB_IN = [0, 1, 2]; // top->R, bottom-left->G, bottom-right->B

// ─────────────────────────────────────────────────────────────────────────────
// Colors
// ─────────────────────────────────────────────────────────────────────────────
const CH_FILL  = ['#cc2222', '#3a6618', '#2244cc'];
const CH_HOVER = ['#ee4444', '#5a8830', '#4466ee'];
const CH_LABEL = ['R', 'G', 'B'];
const OUTLINE  = '#0a0a0f';

// ─────────────────────────────────────────────────────────────────────────────
// State
// ─────────────────────────────────────────────────────────────────────────────
const ANGLE_PER_UNIT = 12; // degrees of rotation per 1.0 change in coefficient
const IDENT = [[1,0,0],[0,1,0],[0,0,1]];

// angles[outCh][inCh] - visual rotation in degrees (unbounded)
const angles = [[0,0,0],[0,0,0],[0,0,0]];
// modes[outCh][inCh] - 'A' (add), 'M' (multiply), 'D' (divide)
const modes = [['A','A','A'],['A','A','A'],['A','A','A']];

const MODE_CYCLE = { A: 'M', M: 'D', D: 'A' };

function getCoeff(o, i) { return IDENT[o][i] + angles[o][i] / ANGLE_PER_UNIT; }
function getMatrix() { return [0,1,2].map(o => [0,1,2].map(i => getCoeff(o, i))); }

let showHints = true;
let cameraRunning = false;
let procW = 0, procH = 0;
let needReinit = true;

// ─────────────────────────────────────────────────────────────────────────────
// Canvas setup (DPR-aware)
// ─────────────────────────────────────────────────────────────────────────────
const triCanvas = document.getElementById('tri-canvas');
const dpr = window.devicePixelRatio || 1;
triCanvas.width = TW * dpr;
triCanvas.height = TH * dpr;
triCanvas.style.width = TW + 'px';
triCanvas.style.height = TH + 'px';
const tctx = triCanvas.getContext('2d');
tctx.scale(dpr, dpr);

const video     = document.getElementById('video');
const offscreen = document.getElementById('offscreen');
const display   = document.getElementById('display');
const octx      = offscreen.getContext('2d', { willReadFrequently: true });
const dctx      = display.getContext('2d');
const overlay   = document.getElementById('overlay-msg');
const errMsg    = document.getElementById('err-msg');
const slSc      = document.getElementById('sl-sc');
const valSc     = document.getElementById('val-sc');

// ─────────────────────────────────────────────────────────────────────────────
// Triangle drawing
// ─────────────────────────────────────────────────────────────────────────────
function drawTri(ctx, v, fill, stroke, lw) {
  ctx.beginPath();
  ctx.moveTo(v[0][0], v[0][1]);
  ctx.lineTo(v[1][0], v[1][1]);
  ctx.lineTo(v[2][0], v[2][1]);
  ctx.closePath();
  if (fill)   { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 2; ctx.stroke(); }
}

function rotVerts(v, deg) {
  const [cx, cy] = ctr(v);
  const r = deg * Math.PI / 180, c = Math.cos(r), s = Math.sin(r);
  return v.map(([x, y]) => {
    const dx = x - cx, dy = y - cy;
    return [cx + dx * c - dy * s, cy + dx * s + dy * c];
  });
}

function clipTri(ctx, v) {
  ctx.beginPath();
  ctx.moveTo(v[0][0], v[0][1]);
  ctx.lineTo(v[1][0], v[1][1]);
  ctx.lineTo(v[2][0], v[2][1]);
  ctx.closePath();
  ctx.clip();
}

let hoverMaj = -1, hoverSub = -1;

function render() {
  tctx.clearRect(0, 0, TW, TH);

  for (let mi = 0; mi < 3; mi++) {
    const outCh = MAJ_OUT[mi];
    const majVerts = L1.subs[mi];

    // Fill major triangle background (output channel color = visible in center gap)
    drawTri(tctx, majVerts, CH_FILL[outCh], null);

    // Clip sub-triangles to major triangle
    tctx.save();
    clipTri(tctx, majVerts);

    for (let si = 0; si < 3; si++) {
      const inCh = SUB_IN[si];
      const base = L2[mi].subs[si];
      const rv = rotVerts(base, angles[outCh][inCh]);
      const hover = (hoverMaj === mi && hoverSub === si);
      drawTri(tctx, rv, hover ? CH_HOVER[inCh] : CH_FILL[inCh], OUTLINE, 2.5);

      // Mode label on the sub-triangle
      const [lx, ly] = ctr(rv);
      const mode = modes[outCh][inCh];
      tctx.fillStyle = mode === 'A' ? '#ffffffaa' : mode === 'M' ? '#ffdd44' : '#ff66aa';
      tctx.font = 'bold 11px monospace';
      tctx.textAlign = 'center';
      tctx.textBaseline = 'middle';
      tctx.fillText(mode, lx, ly);
    }

    tctx.restore();

    // Major triangle outline
    drawTri(tctx, majVerts, null, OUTLINE, 3);

    // Output channel label in center gap
    const cc = ctr(L2[mi].center);
    tctx.fillStyle = '#fff';
    tctx.font = 'bold 16px monospace';
    tctx.textAlign = 'center';
    tctx.textBaseline = 'middle';
    tctx.fillText(CH_LABEL[outCh], cc[0], cc[1]);
  }

  // Outer triangle outline
  drawTri(tctx, outerVerts, null, OUTLINE, 3.5);

  // Hint annotations (disappear after first interaction)
  if (showHints) {
    // Point to the top-left sub-triangle of the top major (the red-on-red one)
    const target = ctr(L2[0].subs[1]); // bottom-left sub of top major
    const tx = target[0] - 52, ty = target[1] + 2;

    tctx.save();
    tctx.font = '9px system-ui, sans-serif';
    tctx.textAlign = 'right';
    tctx.textBaseline = 'middle';

    // "rotate me" with arrow
    tctx.fillStyle = '#aaaacc';
    tctx.fillText('rotate me \u2192', tx, ty - 6);

    // "click me" with arrow
    tctx.fillText('click me \u2192', tx, ty + 6);

    tctx.restore();
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// Hit testing
// ─────────────────────────────────────────────────────────────────────────────
function ptInTri(px, py, v) {
  function sign(p, a, b) { return (p[0] - b[0]) * (a[1] - b[1]) - (a[0] - b[0]) * (p[1] - b[1]); }
  const d1 = sign([px, py], v[0], v[1]);
  const d2 = sign([px, py], v[1], v[2]);
  const d3 = sign([px, py], v[2], v[0]);
  const neg = (d1 < 0) || (d2 < 0) || (d3 < 0);
  const pos = (d1 > 0) || (d2 > 0) || (d3 > 0);
  return !(neg && pos);
}

function hitTest(x, y) {
  for (let mi = 0; mi < 3; mi++) {
    const outCh = MAJ_OUT[mi];
    for (let si = 0; si < 3; si++) {
      const inCh = SUB_IN[si];
      const rv = rotVerts(L2[mi].subs[si], angles[outCh][inCh]);
      if (ptInTri(x, y, rv)) return { mi, si, outCh, inCh };
    }
  }
  return null;
}

// ─────────────────────────────────────────────────────────────────────────────
// Mouse / touch interaction
// ─────────────────────────────────────────────────────────────────────────────
let drag = null;
let dragMoved = false;
let dragStartXY = [0, 0];

function canvasXY(e) {
  const r = triCanvas.getBoundingClientRect();
  const cx = (e.touches ? e.touches[0].clientX : e.clientX);
  const cy = (e.touches ? e.touches[0].clientY : e.clientY);
  return [(cx - r.left) * TW / r.width, (cy - r.top) * TH / r.height];
}

function startDrag(e) {
  const [x, y] = canvasXY(e);
  const hit = hitTest(x, y);
  if (!hit) return;
  const c = ctr(L2[hit.mi].subs[hit.si]);
  const prevA = Math.atan2(y - c[1], x - c[0]) * 180 / Math.PI;
  drag = { ...hit, cx: c[0], cy: c[1], prevA };
  if (showHints) { showHints = false; render(); }
  dragMoved = false;
  dragStartXY = [x, y];
  e.preventDefault();
}

function moveDrag(e) {
  if (!drag) {
    // hover only
    if (!e.touches) {
      const [x, y] = canvasXY(e);
      const hit = hitTest(x, y);
      const nm = hit ? hit.mi : -1, ns = hit ? hit.si : -1;
      if (nm !== hoverMaj || ns !== hoverSub) { hoverMaj = nm; hoverSub = ns; render(); }
    }
    return;
  }
  const [x, y] = canvasXY(e);
  const dist = Math.hypot(x - dragStartXY[0], y - dragStartXY[1]);
  if (dist > 3) dragMoved = true;
  if (!dragMoved) return;

  // Accumulate small deltas frame-to-frame to allow unlimited rotation
  let a = Math.atan2(y - drag.cy, x - drag.cx) * 180 / Math.PI;
  let delta = a - drag.prevA;
  while (delta > 180) delta -= 360;
  while (delta < -180) delta += 360;
  drag.prevA = a;
  angles[drag.outCh][drag.inCh] += delta;
  render();
  updateMatrix();
  e.preventDefault();
}

function endDrag(e) {
  if (drag && !dragMoved) {
    // Click without drag -> toggle mode
    const { outCh, inCh } = drag;
    modes[outCh][inCh] = MODE_CYCLE[modes[outCh][inCh]];
    render();
    updateMatrix();
  }
  drag = null;
}

triCanvas.addEventListener('mousedown', startDrag);
triCanvas.addEventListener('mousemove', moveDrag);
window.addEventListener('mousemove', e => { if (drag) moveDrag(e); });
window.addEventListener('mouseup', endDrag);

triCanvas.addEventListener('touchstart', startDrag, { passive: false });
window.addEventListener('touchmove', e => { if (drag) moveDrag(e); }, { passive: false });
window.addEventListener('touchend', endDrag);

// Double-click to reset one triangle (angle + mode)
triCanvas.addEventListener('dblclick', e => {
  const [x, y] = canvasXY(e);
  const hit = hitTest(x, y);
  if (hit) {
    angles[hit.outCh][hit.inCh] = 0;
    modes[hit.outCh][hit.inCh] = 'A';
    render();
    updateMatrix();
  }
});

// ─────────────────────────────────────────────────────────────────────────────
// Matrix display
// ─────────────────────────────────────────────────────────────────────────────
function updateMatrix() {
  const m = getMatrix();
  const el = document.getElementById('matrix-text');
  el.innerHTML = m.map((row, i) => {
    const cls = ['r', 'g', 'b'][i];
    const label = `<span class="${cls}">${CH_LABEL[i]}</span>`;
    const vals = row.map((v, j) => {
      const mode = modes[i][j];
      const mCls = mode === 'A' ? 'mode-a' : mode === 'M' ? 'mode-m' : 'mode-d';
      const num = (v >= 0 ? ' ' : '') + v.toFixed(2);
      return `${num}<span class="${mCls}">${mode}</span>`;
    }).join(' ');
    return `${label} [ ${vals} ]`;
  }).join('\n');
}

// ─────────────────────────────────────────────────────────────────────────────
// Scale slider
// ─────────────────────────────────────────────────────────────────────────────
slSc.addEventListener('input', () => {
  valSc.textContent = slSc.value + '%';
  needReinit = true;
});

// ─────────────────────────────────────────────────────────────────────────────
// Capture
// ─────────────────────────────────────────────────────────────────────────────
function captureFrame() {
  if (procW === 0) return;
  const a = document.createElement('a');
  a.href = display.toDataURL('image/png');
  a.download = `rgbmix-${Date.now()}.png`;
  a.click();
}
document.getElementById('capture-btn').addEventListener('click', captureFrame);

// ─────────────────────────────────────────────────────────────────────────────
// Reset
// ─────────────────────────────────────────────────────────────────────────────
document.getElementById('reset-btn').addEventListener('click', () => {
  for (let o = 0; o < 3; o++) for (let i = 0; i < 3; i++) {
    angles[o][i] = 0;
    modes[o][i] = 'A';
  }
  render();
  updateMatrix();
});

// ─────────────────────────────────────────────────────────────────────────────
// Random
// ─────────────────────────────────────────────────────────────────────────────
const MODE_LIST = ['A', 'M', 'D'];
document.getElementById('random-btn').addEventListener('click', () => {
  for (let o = 0; o < 3; o++) for (let i = 0; i < 3; i++) {
    angles[o][i] = (Math.random() * 2 - 1) * 90;
    modes[o][i] = MODE_LIST[Math.floor(Math.random() * 3)];
  }
  render();
  updateMatrix();
});

// ─────────────────────────────────────────────────────────────────────────────
// Frame processing loop
// ─────────────────────────────────────────────────────────────────────────────
const EPS = 0.004; // prevent division by zero

function processFrame() {
  requestAnimationFrame(processFrame);
  if (!cameraRunning) return;

  if (needReinit) {
    const sc = parseInt(slSc.value) / 100;
    procW = Math.max(1, Math.round((video.videoWidth || 640) * sc));
    procH = Math.max(1, Math.round((video.videoHeight || 480) * sc));
    offscreen.width = procW;
    offscreen.height = procH;
    display.width = procW;
    display.height = procH;
    needReinit = false;
  }

  if (procW === 0) return;

  octx.drawImage(video, 0, 0, procW, procH);
  const imgData = octx.getImageData(0, 0, procW, procH);
  const src = imgData.data;
  const out = dctx.createImageData(procW, procH);
  const dst = out.data;

  const m = getMatrix();

  // Pre-extract modes for inner loop
  const md = [
    [modes[0][0], modes[0][1], modes[0][2]],
    [modes[1][0], modes[1][1], modes[1][2]],
    [modes[2][0], modes[2][1], modes[2][2]],
  ];

  for (let p = 0, len = src.length; p < len; p += 4) {
    const r = src[p], g = src[p + 1], b = src[p + 2];
    const rgb = [r, g, b];

    for (let o = 0; o < 3; o++) {
      // 1. Always compute full additive sum from all channels
      let val = m[o][0] * r + m[o][1] * g + m[o][2] * b;

      // 2. M/D modes apply extra per-pixel modulation on top
      //    Factor = 1 + k*(ch/255 - 1) = lerp(1, ch/255, k)
      //    At k=0: factor=1 (neutral). At k=1,ch=255: factor=1. At k=1,ch=0: factor=0.
      for (let i = 0; i < 3; i++) {
        const mode = md[o][i];
        if (mode === 'A') continue;
        const k = m[o][i];
        const f = 1 + k * (rgb[i] / 255 - 1);
        if (mode === 'M') {
          val *= f;
        } else {
          // D mode: divide by factor, with epsilon guard
          val /= (Math.abs(f) < EPS ? (f >= 0 ? EPS : -EPS) : f);
        }
      }

      dst[p + o] = val;
    }

    dst[p + 3] = 255;
  }

  dctx.putImageData(out, 0, 0);
}

// ─────────────────────────────────────────────────────────────────────────────
// Camera start
// ─────────────────────────────────────────────────────────────────────────────
document.getElementById('start-btn').addEventListener('click', async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false,
    });
    video.srcObject = stream;
    await video.play();
    cameraRunning = true;
    overlay.classList.add('hidden');
    needReinit = true;
  } catch (e) {
    errMsg.textContent = e.message || 'Camera access denied';
  }
});

// ─────────────────────────────────────────────────────────────────────────────
// Init
// ─────────────────────────────────────────────────────────────────────────────
render();
updateMatrix();
requestAnimationFrame(processFrame);
</script>
</body>
</html>
