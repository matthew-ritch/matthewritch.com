<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spectral Distort</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0a0f; color: #e0e0ee;
    font-family: 'Segoe UI', system-ui, sans-serif;
    display: flex; flex-direction: column;
    height: 100dvh; overflow: hidden;
  }
  #canvas-wrap {
    position: relative; flex: 1 1 0; width: 100%;
    min-height: 0; background: #000; overflow: hidden;
  }
  #display {
    width: 100%; height: 100%; object-fit: contain;
    image-rendering: pixelated; display: block; transform: scaleX(-1);
  }
  #overlay-msg {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 0.75rem;
    background: #0009; font-size: 1rem; color: #aaa;
  }
  #overlay-msg.hidden { display: none; }
  #start-btn {
    padding: 0.6rem 1.4rem; background: #4444aa; border: none;
    border-radius: 6px; color: #eef; font-size: 1rem; cursor: pointer;
  }
  #start-btn:hover { background: #5555cc; }
  #start-btn.hidden { display: none; }
  #controls {
    flex-shrink: 0; background: #0e0e1a; border-top: 1px solid #1e1e33;
    display: flex; flex-direction: column; padding: 0.4rem 0.5rem; gap: 0.3rem;
  }
  #spectrum { width: 100%; cursor: pointer; border-radius: 4px; touch-action: none; }
  #bottom-row {
    display: flex; align-items: center; flex-wrap: wrap; gap: 0.25rem 0.6rem;
  }
  .slider-row { display: flex; align-items: center; gap: 0.3rem; }
  .slider-row label {
    font-size: 0.7rem; color: #6666aa; font-family: monospace; flex-shrink: 0;
  }
  .slider-row input[type=range] { width: 65px; accent-color: #6666cc; cursor: pointer; }
  .slider-row .val {
    font-size: 0.7rem; font-family: monospace; color: #9090cc;
    min-width: 2.8rem; text-align: right;
  }
  .icon-btn {
    padding: 0.35rem 0.55rem; background: #1c1c2e; border: 1px solid #333355;
    border-radius: 5px; color: #8888bb; font-size: 0.75rem; cursor: pointer;
    transition: background 0.12s; white-space: nowrap; user-select: none;
  }
  .icon-btn:hover { background: #2a2a44; color: #ccccee; }
  .icon-btn.active { background: #3a3a6a; border-color: #6666cc; color: #eef; }
  .hint { font-size: 0.58rem; color: #444466; font-family: monospace; margin-left: auto; }
  .hint-mobile { display: none; }
  .hint-desktop { display: inline; }
  @media (max-width: 600px) {
    #controls { padding: 0.3rem; }
    #bottom-row { gap: 0.2rem 0.4rem; }
    .slider-row input[type=range] { width: 50px; }
    .hint-mobile { display: inline; }
    .hint-desktop { display: none; }
  }
  body.fullscreen #controls { display: none; }
  body.fullscreen #canvas-wrap { flex: 1; }

  @media (pointer: coarse) {
    .icon-btn { padding: 0.45rem 0.65rem; font-size: 0.78rem; min-height: 2rem; }
    .slider-row input[type=range] { height: 1.5rem; }
  }
</style>
</head>
<body>
<div id="canvas-wrap">
  <canvas id="display"></canvas>
  <div id="overlay-msg">
    <span id="status-msg">Loading...</span>
    <button id="start-btn" class="hidden">Enable Camera &amp; Mic</button>
    <span id="err-msg" style="color:#cc5555;font-size:0.8rem;"></span>
  </div>
</div>
<div id="controls">
  <canvas id="spectrum"></canvas>
  <div id="bottom-row">
    <div class="slider-row">
      <label>gain</label>
      <input type="range" id="sl-gain" min="0" max="100" value="50" step="1"/>
      <span class="val" id="val-gain">10.0</span>
    </div>
    <div class="slider-row">
      <label>reps</label>
      <input type="range" id="sl-reps" min="1" max="20" value="3" step="1"/>
      <span class="val" id="val-reps">3</span>
    </div>
    <div class="slider-row">
      <label>n</label>
      <input type="range" id="sl-n" min="3" max="20" value="5" step="1"/>
      <span class="val" id="val-n">5</span>
    </div>
    <div class="slider-row">
      <label>sc</label>
      <input type="range" id="sl-sc" min="5" max="100" value="20" step="1"/>
      <span class="val" id="val-sc">20%</span>
    </div>
    <button class="icon-btn" id="add-btn">+</button>
    <button class="icon-btn" id="rm-btn">&minus;</button>
    <button class="icon-btn" id="capture-btn">Save</button>
    <button class="icon-btn" id="random-btn">Rand</button>
    <button class="icon-btn" id="auto-btn">Auto</button>
    <button class="icon-btn" id="reset-buf-btn">Clear</button>
    <button class="icon-btn" id="reset-combs-btn">Defaults</button>
    <button class="icon-btn" id="fullscreen-btn">Full</button>
    <span class="hint">
      <span class="hint-desktop">click: mode &middot; right-click: component &middot; drag: slide &middot; scroll: width &middot; shift-click: toggle</span>
      <span class="hint-mobile">tap: mode &middot; double-tap: component &middot; hold: toggle &middot; drag: slide</span>
    </span>
  </div>
</div>
<video id="video" autoplay playsinline muted style="display:none;"></video>
<canvas id="offscreen" style="display:none;"></canvas>
<script src="spectral_engine.js"></script>
<script>
// ─────────────────────────────────────────────────────────────────────────────
// Component & mode definitions
// ─────────────────────────────────────────────────────────────────────────────
const COMP_NAMES  = ['f1', 'f2', 'f3'];
const COMP_LABELS = ['time', 'dy\u00B2', 'dx\u00B2'];
const COMP_COLORS = ['#ff6644', '#44cc66', '#6644ff'];
const COMP_SCALE  = [0.5, 0.02, 0.02]; // base sensitivity per component

const MODES      = ['+', '\u2212', '\u00D7', '\u00F7', 'e\u02E3', 'ln'];
const MODE_IDS   = [0, 1, 2, 3, 4, 5]; // matches C++ enum
const MODE_NEXT  = [1, 2, 3, 4, 5, 0];

// ─────────────────────────────────────────────────────────────────────────────
// Frequency helpers
// ─────────────────────────────────────────────────────────────────────────────
const MIN_FREQ = 20, MAX_FREQ = 20000;
const LOG_MIN = Math.log(MIN_FREQ), LOG_MAX = Math.log(MAX_FREQ);
const isTouchDevice = matchMedia('(pointer: coarse)').matches;
const SH = isTouchDevice ? 100 : 120;
let SW = 600;

function freqToX(f) {
  return (Math.log(Math.max(MIN_FREQ, Math.min(MAX_FREQ, f))) - LOG_MIN) / (LOG_MAX - LOG_MIN) * SW;
}
function xToFreq(x) {
  return Math.exp(LOG_MIN + (x / SW) * (LOG_MAX - LOG_MIN));
}

// ─────────────────────────────────────────────────────────────────────────────
// Combs — dynamic array, each a sliding tent on the spectrum
// ─────────────────────────────────────────────────────────────────────────────
const combs = [
  { freq: 80,    width: 2.5, comp: 0, mode: 0, active: true },
  { freq: 350,   width: 2.0, comp: 1, mode: 0, active: true },
  { freq: 1400,  width: 2.0, comp: 2, mode: 0, active: true },
  { freq: 5000,  width: 2.0, comp: 1, mode: 2, active: true },
  { freq: 13000, width: 2.5, comp: 2, mode: 5, active: true },
];

// ─────────────────────────────────────────────────────────────────────────────
// State
// ─────────────────────────────────────────────────────────────────────────────
let Module = null;
let wasmReady = false;
let cameraRunning = false;
let audioReady = false;
let procW = 0, procH = 0;
let needReinit = true;
let showHints = true;

let audioCtx, analyser, freqData, binWidth;
let smoothPower = new Float32Array(32);
let autoGainOn = false;
let autoGainVal = 5.0;
let prevOutBuf = null; // for autogain frame-diff

// ─────────────────────────────────────────────────────────────────────────────
// DOM
// ─────────────────────────────────────────────────────────────────────────────
const video     = document.getElementById('video');
const offscreen = document.getElementById('offscreen');
const display   = document.getElementById('display');
const octx      = offscreen.getContext('2d', { willReadFrequently: true });
const dctx      = display.getContext('2d');
const overlay   = document.getElementById('overlay-msg');
const statusMsg = document.getElementById('status-msg');
const errMsg    = document.getElementById('err-msg');
const startBtn  = document.getElementById('start-btn');
const specCanvas= document.getElementById('spectrum');
const sctx      = specCanvas.getContext('2d');

// ─────────────────────────────────────────────────────────────────────────────
// Symlog gain slider: 0% → 1, 50% → 10, 100% → 100
// ─────────────────────────────────────────────────────────────────────────────
const slGain = document.getElementById('sl-gain');
const valGain = document.getElementById('val-gain');
const autoBtn = document.getElementById('auto-btn');
// Gain: 0→0, 1-33→0..1 (linear fine control), 34-66→1..10 (log), 67-100→10..100 (log)
function sliderGain() {
  const v = parseInt(slGain.value);
  if (v === 0) return 0;
  if (v <= 33) return v / 33;
  if (v <= 66) return Math.pow(10, (v - 33) / 33);
  return Math.pow(10, 1 + (v - 66) / 34);
}
function getGain() { return autoGainOn ? autoGainVal : sliderGain(); }
function updateGainLabel() {
  const g = getGain();
  valGain.textContent = g >= 10 ? g.toFixed(0) : g.toFixed(1);
}
slGain.addEventListener('input', updateGainLabel);
autoBtn.addEventListener('click', () => {
  autoGainOn = !autoGainOn;
  if (autoGainOn) autoGainVal = sliderGain() || 5;
  autoBtn.classList.toggle('active', autoGainOn);
  updateGainLabel();
});
updateGainLabel();

const slReps = document.getElementById('sl-reps');
const valReps = document.getElementById('val-reps');
slReps.addEventListener('input', () => { valReps.textContent = slReps.value; });
valReps.textContent = slReps.value;

const slN  = document.getElementById('sl-n');
const valN = document.getElementById('val-n');
slN.addEventListener('input', () => { valN.textContent = slN.value; needReinit = true; });
valN.textContent = slN.value;

const slSc  = document.getElementById('sl-sc');
const valSc = document.getElementById('val-sc');
slSc.addEventListener('input', () => { valSc.textContent = slSc.value + '%'; needReinit = true; });
valSc.textContent = slSc.value + '%';

// ─────────────────────────────────────────────────────────────────────────────
// Spectrum canvas sizing
// ─────────────────────────────────────────────────────────────────────────────
const dpr = window.devicePixelRatio || 1;
function resizeSpectrum() {
  SW = Math.max(200, specCanvas.parentElement.clientWidth - 16);
  specCanvas.width = SW * dpr;
  specCanvas.height = SH * dpr;
  specCanvas.style.width = SW + 'px';
  specCanvas.style.height = SH + 'px';
  sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resizeSpectrum();
window.addEventListener('resize', resizeSpectrum);

// ─────────────────────────────────────────────────────────────────────────────
// Audio — triangular window power per comb
// ─────────────────────────────────────────────────────────────────────────────
function updatePowers() {
  if (!audioReady) return;
  analyser.getByteFrequencyData(freqData);
  for (let c = 0; c < combs.length; c++) {
    const comb = combs[c];
    const centerLog = Math.log2(comb.freq);
    const halfW = comb.width / 2;
    let sum = 0, wSum = 0;
    for (let i = 1; i < freqData.length; i++) {
      const f = i * binWidth;
      if (f < MIN_FREQ || f > MAX_FREQ) continue;
      const dist = Math.abs(Math.log2(f) - centerLog) / halfW;
      if (dist > 1) continue;
      const w = 1 - dist;
      sum += freqData[i] * w;
      wSum += w;
    }
    const instant = wSum > 0 ? sum / (wSum * 255) : 0;
    // Fast attack, moderate decay + beat onset punch
    const prev = smoothPower[c];
    if (instant >= prev) {
      smoothPower[c] = instant;
    } else {
      smoothPower[c] = prev * 0.82 + instant * 0.18;
    }
    if (instant > prev * 1.8 + 0.05) {
      smoothPower[c] = Math.min(1, instant * 1.5);
    }
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// Comb geometry & hit testing
// ─────────────────────────────────────────────────────────────────────────────
const PEAK_Y = 22, BASE_Y_OFF = 14;

function combTri(comb) {
  const cx = freqToX(comb.freq);
  const lx = freqToX(comb.freq / Math.pow(2, comb.width / 2));
  const rx = freqToX(comb.freq * Math.pow(2, comb.width / 2));
  return { cx, lx, rx, py: PEAK_Y, by: SH - BASE_Y_OFF };
}

function ptInTent(px, py, t) {
  if (py < t.py || py > t.by || px < t.lx || px > t.rx) return false;
  const frac = (py - t.py) / (t.by - t.py);
  const xL = t.cx + (t.lx - t.cx) * frac;
  const xR = t.cx + (t.rx - t.cx) * frac;
  return px >= xL && px <= xR;
}

function hitComb(x, y) {
  for (let i = combs.length - 1; i >= 0; i--)
    if (ptInTent(x, y, combTri(combs[i]))) return i;
  return -1;
}

// ─────────────────────────────────────────────────────────────────────────────
// Spectrum rendering
// ─────────────────────────────────────────────────────────────────────────────
let dragComb = -1;

function drawSpectrum() {
  sctx.clearRect(0, 0, SW, SH);
  sctx.fillStyle = '#06060c';
  sctx.fillRect(0, 0, SW, SH);

  // FFT bars
  if (audioReady) {
    for (let i = 1; i < freqData.length; i++) {
      const f = i * binWidth;
      if (f < MIN_FREQ || f > MAX_FREQ) continue;
      const x = freqToX(f), nx = freqToX(f + binWidth);
      const bw = Math.max(1, (nx - x) * 0.85);
      const h = (freqData[i] / 255) * (SH - 26);
      const t = (Math.log(f) - LOG_MIN) / (LOG_MAX - LOG_MIN);
      sctx.fillStyle = `rgba(${50+t*160|0},${50+(1-Math.abs(t-.5)*2)*100|0},${150-t*120|0},0.4)`;
      sctx.fillRect(x, SH - BASE_Y_OFF - h, bw, h);
    }
  }

  // Comb tents
  for (let i = 0; i < combs.length; i++) {
    const comb = combs[i];
    const tri = combTri(comb);
    const color = COMP_COLORS[comb.comp];
    const power = smoothPower[i] || 0;

    sctx.beginPath();
    sctx.moveTo(tri.lx, tri.by);
    sctx.lineTo(tri.cx, tri.py);
    sctx.lineTo(tri.rx, tri.by);
    sctx.closePath();

    sctx.fillStyle = color;
    sctx.globalAlpha = (comb.active ? 0.12 : 0.04) + (comb.active ? power * 0.3 : 0);
    sctx.fill();
    sctx.globalAlpha = comb.active ? 0.6 : 0.15;
    sctx.strokeStyle = color;
    sctx.lineWidth = dragComb === i ? 2.5 : 1.5;
    sctx.stroke();
    sctx.globalAlpha = 1;

    // Labels: component + mode
    sctx.textAlign = 'center';
    sctx.fillStyle = comb.active ? color : '#555';
    sctx.font = 'bold 10px monospace';
    sctx.textBaseline = 'bottom';
    sctx.fillText(COMP_NAMES[comb.comp], tri.cx - 8, tri.py - 1);
    sctx.fillText(MODES[comb.mode], tri.cx + 10, tri.py - 1);

    if (comb.active && audioReady) {
      sctx.font = '8px monospace';
      sctx.fillStyle = `rgba(255,255,255,${0.3 + power * 0.5})`;
      sctx.textBaseline = 'top';
      sctx.fillText(power.toFixed(2), tri.cx, tri.py + 2);
    }
    if (!comb.active) {
      sctx.font = 'bold 9px monospace';
      sctx.fillStyle = '#ff444466';
      sctx.textBaseline = 'top';
      sctx.fillText('OFF', tri.cx, tri.py + 2);
    }
  }

  // Frequency axis
  sctx.fillStyle = '#333'; sctx.font = '8px monospace';
  sctx.textBaseline = 'bottom'; sctx.textAlign = 'center';
  for (const [f, l] of [[50,'50'],[100,'100'],[200,'200'],[500,'500'],[1000,'1k'],[2000,'2k'],[5000,'5k'],[10000,'10k']])
    sctx.fillText(l, freqToX(f), SH - 1);

  // Hints
  if (showHints && combs.length > 0) {
    const tri = combTri(combs[0]);
    const hx = tri.lx - 6;
    sctx.textAlign = 'right'; sctx.textBaseline = 'middle';
    sctx.font = '9px system-ui, sans-serif'; sctx.fillStyle = '#8888bbcc';
    if (isTouchDevice) {
      sctx.fillText('tap me \u2192', hx, tri.py + 8);
      sctx.fillText('drag me \u2192', hx, tri.py + 20);
    } else {
      sctx.fillText('click me \u2192', hx, tri.py + 4);
      sctx.fillText('drag me \u2192', hx, tri.py + 16);
      sctx.fillText('scroll me \u2192', hx, tri.py + 28);
    }
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// Interaction
// ─────────────────────────────────────────────────────────────────────────────
let dragMoved = false, dragStartX = 0;

function specXY(e) {
  const r = specCanvas.getBoundingClientRect();
  const cx = e.touches ? e.touches[0].clientX : e.clientX;
  const cy = e.touches ? e.touches[0].clientY : e.clientY;
  return [(cx - r.left) * SW / r.width, (cy - r.top) * SH / r.height];
}

specCanvas.addEventListener('mousedown', e => {
  const [x, y] = specXY(e);
  dragComb = hitComb(x, y);
  dragMoved = false; dragStartX = x;
  if (dragComb >= 0) { showHints = false; e.preventDefault(); }
});

window.addEventListener('mousemove', e => {
  if (dragComb < 0) return;
  const [x] = specXY(e);
  if (Math.abs(x - dragStartX) > 4) dragMoved = true;
  if (dragMoved) combs[dragComb].freq = Math.max(MIN_FREQ, Math.min(MAX_FREQ, xToFreq(x)));
});

window.addEventListener('mouseup', e => {
  if (dragComb >= 0 && !dragMoved) {
    if (e.shiftKey) {
      combs[dragComb].active = !combs[dragComb].active;
    } else {
      combs[dragComb].mode = MODE_NEXT[combs[dragComb].mode];
    }
  }
  dragComb = -1;
});

specCanvas.addEventListener('contextmenu', e => {
  e.preventDefault();
  const [x, y] = specXY(e);
  const c = hitComb(x, y);
  if (c >= 0) combs[c].comp = (combs[c].comp + 1) % 3;
});

specCanvas.addEventListener('wheel', e => {
  e.preventDefault();
  const [x, y] = specXY(e);
  const c = hitComb(x, y);
  if (c < 0) return;
  combs[c].width = Math.max(0.5, Math.min(6, combs[c].width + (e.deltaY > 0 ? 0.2 : -0.2)));
}, { passive: false });

specCanvas.addEventListener('mousemove', e => {
  if (dragComb >= 0) return;
  const [x, y] = specXY(e);
  specCanvas.style.cursor = hitComb(x, y) >= 0 ? 'grab' : 'default';
});

// Touch: tap=mode, double-tap=component, long-press=toggle, drag=slide
let longPressTimer = null, longPressFired = false;
let lastTapTime = 0, lastTapComb = -1;

specCanvas.addEventListener('touchstart', e => {
  const [x, y] = specXY(e);
  dragComb = hitComb(x, y);
  dragMoved = false; longPressFired = false; dragStartX = x;
  if (dragComb >= 0) {
    showHints = false; e.preventDefault();
    longPressTimer = setTimeout(() => {
      longPressFired = true;
      combs[dragComb].active = !combs[dragComb].active;
      if (navigator.vibrate) navigator.vibrate(30);
    }, 400);
  }
}, { passive: false });

window.addEventListener('touchmove', e => {
  if (dragComb < 0) return;
  if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
  const rect = specCanvas.getBoundingClientRect();
  const x = (e.touches[0].clientX - rect.left) * SW / rect.width;
  if (Math.abs(x - dragStartX) > 6) dragMoved = true;
  if (dragMoved) combs[dragComb].freq = Math.max(MIN_FREQ, Math.min(MAX_FREQ, xToFreq(x)));
}, { passive: false });

window.addEventListener('touchend', () => {
  if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
  if (dragComb >= 0 && !dragMoved && !longPressFired) {
    const now = Date.now();
    if (now - lastTapTime < 350 && lastTapComb === dragComb) {
      // Double-tap: cycle component
      combs[dragComb].comp = (combs[dragComb].comp + 1) % 3;
      lastTapTime = 0;
    } else {
      // Single tap: cycle mode
      combs[dragComb].mode = MODE_NEXT[combs[dragComb].mode];
      lastTapTime = now; lastTapComb = dragComb;
    }
  }
  dragComb = -1;
});

// ─────────────────────────────────────────────────────────────────────────────
// Add / Remove combs
// ─────────────────────────────────────────────────────────────────────────────
document.getElementById('add-btn').addEventListener('click', () => {
  if (combs.length >= 32) return;
  combs.push({
    freq: MIN_FREQ * Math.pow(MAX_FREQ / MIN_FREQ, Math.random()),
    width: 1.5 + Math.random() * 2,
    comp: Math.floor(Math.random() * 3),
    mode: 0,
    active: true,
  });
});

document.getElementById('rm-btn').addEventListener('click', () => {
  if (combs.length > 1) combs.pop();
});

// ─────────────────────────────────────────────────────────────────────────────
// Random / Capture / Reset
// ─────────────────────────────────────────────────────────────────────────────
document.getElementById('random-btn').addEventListener('click', () => {
  for (const c of combs) {
    c.freq = MIN_FREQ * Math.pow(MAX_FREQ / MIN_FREQ, Math.random());
    c.width = 0.8 + Math.random() * 4;
    c.comp = Math.floor(Math.random() * 3);
    c.mode = Math.floor(Math.random() * 6);
    c.active = true;
  }
});

document.getElementById('capture-btn').addEventListener('click', () => {
  if (procW === 0) return;
  const a = document.createElement('a');
  a.href = display.toDataURL('image/png');
  a.download = `spectral-${Date.now()}.png`;
  a.click();
});

document.getElementById('reset-buf-btn').addEventListener('click', () => {
  if (wasmReady) Module._reset();
  smoothPower.fill(0);
});

const DEFAULT_COMBS = [
  { freq: 80,    width: 2.5, comp: 0, mode: 0, active: true },
  { freq: 350,   width: 2.0, comp: 1, mode: 0, active: true },
  { freq: 1400,  width: 2.0, comp: 2, mode: 0, active: true },
  { freq: 5000,  width: 2.0, comp: 1, mode: 2, active: true },
  { freq: 13000, width: 2.5, comp: 2, mode: 5, active: true },
];

document.getElementById('reset-combs-btn').addEventListener('click', () => {
  combs.length = 0;
  for (const d of DEFAULT_COMBS) combs.push({ ...d });
  if (wasmReady) Module._reset();
  smoothPower.fill(0);
});

// ─────────────────────────────────────────────────────────────────────────────
// Fullscreen — press F or click Full button
// ─────────────────────────────────────────────────────────────────────────────
function toggleFullscreen() {
  const entering = !document.body.classList.contains('fullscreen');
  document.body.classList.toggle('fullscreen');
  // Try native fullscreen as bonus — works on desktop, may fail on mobile
  if (entering) {
    const el = document.documentElement;
    (el.requestFullscreen || el.webkitRequestFullscreen || (() => {})).call(el).catch(() => {});
  } else {
    const ex = document.exitFullscreen || document.webkitExitFullscreen;
    if (ex && document.fullscreenElement) ex.call(document).catch(() => {});
  }
}
document.addEventListener('fullscreenchange', () => {
  // Sync class if user exits via ESC
  if (!document.fullscreenElement && !document.webkitFullscreenElement) {
    document.body.classList.remove('fullscreen');
  }
});
document.getElementById('fullscreen-btn').addEventListener('click', toggleFullscreen);
document.addEventListener('keydown', e => {
  if (e.key === 'f' || e.key === 'F') {
    if (e.target.tagName === 'INPUT') return;
    toggleFullscreen();
  }
});

// ─────────────────────────────────────────────────────────────────────────────
// WASM init / reinit
// ─────────────────────────────────────────────────────────────────────────────
function reinitWasm() {
  if (!wasmReady) return;
  const sc = parseInt(slSc.value) / 100;
  procW = Math.max(1, Math.round((video.videoWidth || 640) * sc));
  procH = Math.max(1, Math.round((video.videoHeight || 480) * sc));
  offscreen.width = procW; offscreen.height = procH;
  display.width = procW; display.height = procH;
  Module._init(parseInt(slN.value), procW, procH);
  prevOutBuf = new Uint8Array(procW * procH * 4);
  needReinit = false;
}

// ─────────────────────────────────────────────────────────────────────────────
// Adaptive gain — measures distortion level, ramps gain to keep things wild
// ─────────────────────────────────────────────────────────────────────────────
function updateAutoGain(outData) {
  if (!autoGainOn || !prevOutBuf) return;

  let totalPower = 0;
  for (let c = 0; c < combs.length; c++) totalPower += (smoothPower[c] || 0);
  if (totalPower < 0.02) return;

  // Sample every 8th pixel: diff from raw input + change from previous frame
  const len = procW * procH * 4;
  let diffSum = 0, changeSum = 0, n = 0;
  for (let i = 0; i < len; i += 32) { // every 8th pixel (8*4=32)
    diffSum   += Math.abs(outData[i] - prevOutBuf[i])
               + Math.abs(outData[i+1] - prevOutBuf[i+1])
               + Math.abs(outData[i+2] - prevOutBuf[i+2]);
    n++;
  }
  prevOutBuf.set(outData);
  const change = diffSum / (n * 3 * 255);

  const TARGET_LO = 0.12, TARGET_HI = 0.40;
  const maxGain = sliderGain() * 3;

  if (change < 0.001) {
    autoGainVal *= 0.90;
  } else if (change < TARGET_LO) {
    autoGainVal = Math.min(maxGain, autoGainVal * 1.08);
  } else if (change > TARGET_HI) {
    autoGainVal = Math.max(0.05, autoGainVal * 0.95);
  }

  updateGainLabel();
}

// ─────────────────────────────────────────────────────────────────────────────
// Frame loop
// ─────────────────────────────────────────────────────────────────────────────
function frame() {
  requestAnimationFrame(frame);
  updatePowers();
  drawSpectrum();

  if (!cameraRunning || !wasmReady) return;
  if (needReinit || procW === 0) { reinitWasm(); if (procW === 0) return; }

  // Camera → WASM input
  octx.drawImage(video, 0, 0, procW, procH);
  const imgData = octx.getImageData(0, 0, procW, procH);
  const inPtr = Module._get_input_ptr();
  Module.HEAPU8.set(imgData.data, inPtr);

  // Write comb configs to WASM
  const combPtr = Module._get_comb_ptr();
  const f32Off = combPtr >> 2; // float32 offset
  const gain = getGain();
  let activeCombCount = 0;

  for (let c = 0; c < combs.length; c++) {
    if (!combs[c].active) continue;
    const power = smoothPower[c] || 0;
    if (power < 0.001) continue;
    const coeff = power * gain * COMP_SCALE[combs[c].comp];
    Module.HEAPF32[f32Off + activeCombCount * 3 + 0] = combs[c].comp;
    Module.HEAPF32[f32Off + activeCombCount * 3 + 1] = combs[c].mode;
    Module.HEAPF32[f32Off + activeCombCount * 3 + 2] = coeff;
    activeCombCount++;
  }

  // Process
  Module._process_combs(activeCombCount, parseInt(slReps.value));

  // Read output
  const outPtr = Module._get_output_ptr();
  const outData = Module.HEAPU8.subarray(outPtr, outPtr + procW * procH * 4);
  updateAutoGain(outData);
  const id = new ImageData(new Uint8ClampedArray(outData), procW, procH);
  dctx.putImageData(id, 0, 0);
}

// ─────────────────────────────────────────────────────────────────────────────
// Camera + mic
// ─────────────────────────────────────────────────────────────────────────────
startBtn.addEventListener('click', async () => {
  try {
    audioCtx = new AudioContext();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 2048;
    analyser.smoothingTimeConstant = 0.15;
    freqData = new Uint8Array(analyser.frequencyBinCount);
    binWidth = audioCtx.sampleRate / analyser.fftSize;
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: true,
    });
    video.srcObject = new MediaStream(stream.getVideoTracks());
    await video.play();
    const source = audioCtx.createMediaStreamSource(new MediaStream(stream.getAudioTracks()));
    source.connect(analyser);
    audioReady = true;
    if (audioCtx.state === 'suspended') await audioCtx.resume();
    cameraRunning = true;
    overlay.classList.add('hidden');
    needReinit = true;
  } catch (e) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false,
      });
      video.srcObject = stream; await video.play();
      cameraRunning = true; overlay.classList.add('hidden'); needReinit = true;
      errMsg.textContent = 'No mic — camera only'; errMsg.style.color = '#aa8833';
    } catch (e2) { errMsg.textContent = e2.message || 'Camera access denied'; }
  }
});

// ─────────────────────────────────────────────────────────────────────────────
// Load WASM
// ─────────────────────────────────────────────────────────────────────────────
SpectralModule().then(mod => {
  Module = mod;
  wasmReady = true;
  statusMsg.textContent = 'Camera & microphone not started';
  startBtn.classList.remove('hidden');
  requestAnimationFrame(frame);
}).catch(err => {
  statusMsg.textContent = 'Failed to load WASM — see console';
  console.error(err);
});
</script>
